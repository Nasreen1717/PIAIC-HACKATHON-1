name: Module 1 CI/CD Pipeline

on:
  push:
    branches: [ main, 001-ros2-fundamentals ]
  pull_request:
    branches: [ main, 001-ros2-fundamentals ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pytest

      - name: Run flake8
        run: flake8 --config .flake8 examples/ exercises/ tests/ scripts/
        continue-on-error: true

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        continue-on-error: true

  markdown:
    name: Markdown Validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Validate Markdown
        run: markdownlint --config .markdownlint.json docs/ README.md
        continue-on-error: true

  docusaurus:
    name: Build Documentation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: cd Front-End-Book && npm ci

      - name: Build Docusaurus
        run: cd Front-End-Book && npm run build
        continue-on-error: true
